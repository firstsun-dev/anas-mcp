openapi: 3.2.0
info:
  title: anas-mcp HTTP API
  version: 0.1.0
  summary: HTTP surface for the Firstsun analytics MCP service
  description: |
    Canonical OpenAPI contract for HTTP endpoints exposed by `anas-mcp`.

    This document describes the HTTP transport surface. MCP tool names,
    tool input schemas, and tool output schemas remain defined by the MCP
    server implementation and its MCP/Zod contracts; they are not modeled as
    fake REST endpoints here.

    Production `/mcp` is protected by one Cloudflare Access application that
    concurrently accepts two authentication modes: Mode A, Managed OAuth
    (interactive clients such as ChatGPT), and Mode B, Access Service Tokens
    (headless agents and automation). Cloudflare Access evaluates the client
    credentials at the edge and OAuth discovery/authorization is owned by
    Access, not by this Worker. The Worker validates the resulting
    `Cf-Access-Jwt-Assertion` application assertion before any MCP processing.
    `/health` is outside the Access application and stays public.
servers:
  - url: http://localhost:8787
    description: Local development
  - url: https://{productionHost}
    description: Production host after provisioning
    variables:
      productionHost:
        default: analytics-mcp.example.invalid
        description: Replace with the provisioned production hostname; do not treat this placeholder as deploy configuration.
tags:
  - name: Health
    description: Minimal service readiness
  - name: MCP
    description: Model Context Protocol Streamable HTTP transport
paths:
  /health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Service readiness
      description: |
        Returns minimal readiness only and requires no authentication. It must
        never expose credentials, authentication configuration, secret-binding
        state, provider token state, Hyperdrive configuration, or analytics data.
      security: []
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                ready:
                  value:
                    service: anas-mcp
                    status: ok
  /mcp:
    post:
      operationId: handleMcp
      tags: [MCP]
      summary: MCP Streamable HTTP request
      description: |
        Handles MCP protocol messages through the stateless Cloudflare Agents
        SDK `createMcpHandler()` transport.

        This operation intentionally documents the HTTP transport rather than
        enumerating MCP tools as REST operations. Use MCP initialization and
        `tools/list` to discover the active tool contract.

        Requests are authenticated by Cloudflare Access (Managed OAuth or a
        Service Token, concurrently) and reach the Worker with a signed
        `Cf-Access-Jwt-Assertion`. The Worker verifies that assertion
        (signature, issuer, application AUD, expiry) before MCP initialization,
        tool execution, or database access. Requests Access rejects never reach
        the Worker; Access answers with its own challenge/denial.
      security:
        - CloudflareAccessOAuth: []
        - CloudflareAccessServiceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpProtocolMessage'
      responses:
        '200':
          description: MCP protocol response or stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpProtocolMessage'
            text/event-stream:
              schema:
                type: string
              description: Streamable MCP response when negotiated by the transport.
        '202':
          description: MCP notification/request accepted when the protocol operation does not require an immediate response body.
        '400':
          description: Invalid MCP or HTTP request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The request reached the Worker without a valid Cloudflare Access assertion. The body is a generic error and never echoes credentials or assertion details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
              examples:
                unauthorized:
                  value:
                    error: unauthorized
        '503':
          description: The Worker cannot validate Access assertions because its non-secret Access configuration is missing; it fails closed before any MCP processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUnavailableResponse'
              examples:
                unavailable:
                  value:
                    error: auth_unavailable
        '404':
          description: Route not found or request is not valid for the configured MCP route
        '405':
          description: HTTP method not supported by the configured stateless transport
components:
  securitySchemes:
    CloudflareAccessOAuth:
      type: oauth2
      description: |
        Mode A. Cloudflare Access Managed OAuth (authorization code + PKCE).
        Discovery, dynamic client registration, authorization, and token
        endpoints are owned by Cloudflare Access and advertised by it; they are
        not implemented by this Worker and are intentionally not enumerated here.
      flows:
        authorizationCode:
          authorizationUrl: https://{accessTeamDomain}/cdn-cgi/access/oauth/authorization
          tokenUrl: https://{accessTeamDomain}/cdn-cgi/access/oauth/token
          scopes: {}
    CloudflareAccessServiceToken:
      type: apiKey
      in: header
      name: CF-Access-Client-Id
      description: |
        Mode B. Cloudflare Access Service Token, sent with BOTH headers
        `CF-Access-Client-Id` and `CF-Access-Client-Secret` and authorized by an
        Access `Service Auth` policy. The secret is held by the machine client's
        operator and is never stored by or sent to the Worker.
  schemas:
    UnauthorizedResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          const: unauthorized
    AuthUnavailableResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          const: auth_unavailable
    HealthResponse:
      type: object
      additionalProperties: false
      required: [service, status]
      properties:
        service:
          type: string
          const: anas-mcp
        status:
          type: string
          enum: [ok]
    McpProtocolMessage:
      type: object
      description: |
        MCP protocol message envelope. The authoritative protocol schema is the
        MCP specification and the installed MCP server SDK, not this OpenAPI
        approximation. Fields are intentionally open to preserve protocol-version
        compatibility.
      additionalProperties: true
    ErrorResponse:
      type: object
      description: Safe error response that must not contain credentials, Access assertions, OAuth tokens, or raw provider secrets.
      additionalProperties: true
