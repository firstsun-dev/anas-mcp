name: CI/CD

# VERIFICATION ONLY. Deployment ownership of the Cloudflare Worker `anas-mcp` moved to
# firstsun-dev/innovation-apps (apps/anas-mcp); see docs/cutover.md. This workflow deliberately has no deploy path:
# no reusable `_cf-worker-v2.yml` call, no Cloudflare credentials, no `wrangler deploy`/`versions` commands (the only
# Wrangler call is the credential-free `--dry-run` bundle check), and read-only permissions.
#
# Triggers: `push` only (same-repo PRs are covered by their branch push). No `pull_request` (public repository),
# no `workflow_dispatch`, no `schedule`. Runs on GitHub-hosted runners; no secrets are referenced.

on:
  push:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (pnpm install, typecheck, tests, OpenAPI, wrangler dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm exec wrangler deploy --dry-run
