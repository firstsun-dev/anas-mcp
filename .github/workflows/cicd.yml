name: CI/CD

# Thin caller of the organization-managed Cloudflare Worker pipeline v2 (see docs/cicd.md). It contains no Wrangler,
# version-upload, deploy or rollback logic. Strategy is `production-only`: every branch push / same-repo PR runs
# verification only; ONLY a push to `main` deploys Production. No Native Preview, no Shared Dev, no persistent Dev.
#
# Deliberately NOT triggered by `workflow_dispatch` (it would deploy Production from main), `delete` (the lifecycle
# job is skipped for production-only) or `pull_request`: the shared CI jobs need the org's self-hosted runners (the
# shared setup action expects a pre-installed pnpm; verified to fail on ubuntu-latest), and this repository is public,
# so a fork PR must never reach them. Only branches of this repository run CI, and only `main` deploys.

on:
  push: # all branches: verification-only except main (same-repo PRs are covered by their branch push)

permissions:
  contents: write # ceiling required by the callee's (here skipped, release_cmd unset) Release job; the Deploy job itself is contents: read
  deployments: write # requested by the reusable workflow's Deploy job (Production deployment ledger)
  pull-requests: write # requested by the reusable workflow's Deploy job

jobs:
  cf:
    # uses and tools_ref MUST be the same ref (verified commit of firstsun-dev/.github; see docs/cicd.md).
    uses: firstsun-dev/.github/.github/workflows/_cf-worker-v2.yml@3cf1d52891f04cde737af10ea303f9b7d6b2e6ef
    with:
      tools_ref: 3cf1d52891f04cde737af10ea303f9b7d6b2e6ef
      app_name: anas-mcp
      app_path: .
      app_version: ${{ github.sha }}
      deployment_strategy: production-only
      preview_on_branch_push: false
      shared_dev_on_branch_push: false
      wrangler_config: wrangler.jsonc
      # Aggregate gate (typecheck, Vitest, OpenAPI lint), unchanged from the previous pipeline.
      test_unit_cmd: pnpm run check
      # Wrangler bundles the Worker in `versions upload`; this is a credential-free build-validation gate only.
      build_cmd: pnpm exec wrangler deploy --dry-run
      app_url_prod: https://mcp.firstsun.org
      # Never auto-revert: a previous Worker version may predate Cloudflare Access authentication.
      production_rollback_policy: manual
      smoke_cmd: scripts/smoke-prod.sh
      smoke_env: |
        BASE_URL=https://mcp.firstsun.org
        EXPECTED_ISSUER=https://firstsun.cloudflareaccess.com
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
