name: PR Verify

# Test-only verification gate. This workflow can NOT deploy: it triggers on pull_request only, holds read-only
# permissions, uses no secrets, and runs `wrangler deploy --dry-run` (no Cloudflare credentials, no upload).
# Production deployment is cicd.yml (push to main only, via firstsun-dev/.github); see docs/cicd.md.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (pnpm install, typecheck, tests, OpenAPI, wrangler dry-run)
    # GitHub-hosted runner on purpose: this repository is public, so PR code must not run on the org's self-hosted runners.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6 # version comes from package.json `packageManager`
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install (lockfile-exact)
        run: pnpm install --frozen-lockfile
      - name: Typecheck, Vitest, OpenAPI lint
        run: pnpm run check
      - name: Wrangler dry run (build only, no deploy)
        run: pnpm exec wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
