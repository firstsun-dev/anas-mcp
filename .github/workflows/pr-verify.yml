name: PR Verify

# Test-only verification gate. This workflow can NOT deploy: it triggers on pull_request only, holds read-only
# permissions, uses no secrets, and runs `wrangler deploy --dry-run` (no Cloudflare credentials, no upload).
# Deployment stays delegated to firstsun-dev/.github (_cf-worker-template.yml); see docs/cicd.md for why that
# template cannot yet be used here (it runs `pnpm install --frozen-lockfile`; this repo uses npm).

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (npm ci, typecheck, tests, OpenAPI, wrangler dry-run)
    # GitHub-hosted runner on purpose: this repository is public, so PR code must not run on the org's self-hosted runners.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install (lockfile-exact)
        run: npm ci
      - name: Typecheck, Vitest, OpenAPI lint
        run: npm run check
      - name: Wrangler dry run (build only, no deploy)
        run: npx wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
